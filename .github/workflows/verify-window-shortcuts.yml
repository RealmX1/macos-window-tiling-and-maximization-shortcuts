name: 验证窗口快捷键

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-window-tiling-and-maximization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: 检查语法并验证窗口快捷键
        run: |
          luac5.4 -p window_tiling_and_maximization_shortcuts.lua
          lua5.4 tests/verify_window_tiling_and_maximization_shortcuts.lua
